<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPT Canvas Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">GPT CANVAS / P1</p>
    <h1>单任务桥接</h1>
    <p class="intro">严格串行 · 单次自动提交 · 本地结果回收</p>

    <label>本地服务地址
      <input id="apiRoot" value="http://127.0.0.1:3220" spellcheck="false">
    </label>
    <label>本地桥接令牌
      <input id="token" type="password" autocomplete="off" placeholder="读取 runtime/bridge-token.txt">
    </label>
    <div class="buttons">
      <button id="save" class="secondary">保存并检查</button>
      <button id="claim" class="primary">领取任务</button>
    </div>

    <section class="run">
      <p class="caption">当前任务</p>
      <strong id="taskId">未领取</strong>
      <span id="status">—</span>
      <p id="detail">启动 P1 服务后创建一条任务。</p>
    </section>
    <button id="open" class="open" disabled>打开任务 →</button>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
